name: "Mod Video Progress"
summary: "Advanced video player with controls, integrations, and detailed reports."
description: |
  Advanced video player with controls, integrations, and detailed reports.

  With the aim of providing a more dynamic and customizable teaching experience, I present the Video Progress Module, a tool that enhances Moodle's capabilities by allowing easy addition of YouTube, Google Drive, or Vimeo videos.

  Supported Moodle versions in the supplied plugin list: 3.8 - 5.0.

labels:
  - fully-free
category: "video"
